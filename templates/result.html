<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Quiz Completed!</h1>

        <div class="score">
            {{ score }} / {{ total }}
        </div>

        <h2>{{ percentage }}%</h2>

        {% if percentage >= 80 %}
            <p>🎉 Excellent performance!</p>
        {% elif percentage >= 50 %}
            <p>👍 Good job! Keep improving.</p>
        {% else %}
            <p>📚 Keep practicing and try again.</p>
        {% endif %}

        <a href="/quiz" class="btn">Try Again</a>

        <a href="/" class="secondary-btn">Home</a>

    </div>
</div>

</body>
</html>
